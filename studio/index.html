<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>空空山谷 · 作品管理</title><link rel="stylesheet" href="/style.css"><style>body{padding:30px;max-width:1200px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}h1{font-size:2.2rem}h2{font:600 1.2rem Arial}main{display:grid;grid-template-columns:300px 1fr;gap:30px}button,input,textarea,select{font:inherit;padding:10px;border:1px solid var(--line);background:white;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:block;margin:14px 0 6px}input:not([type=checkbox]),textarea{width:100%}textarea{min-height:110px}.row{display:flex;gap:10px;flex-wrap:wrap}.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0}.item[aria-pressed=true]{border:2px solid var(--ink)}.item img{width:52px;height:65px;object-fit:cover}.hint{font-size:14px;margin:15px 0}.preview{width:150px;height:180px;object-fit:contain}.frames{display:flex;gap:8px;overflow:auto}.frames figure{margin:0;flex:0 0 95px}.frames img{height:95px;object-fit:cover}.frames button{padding:4px;font-size:14px}#status{min-height:30px;font-weight:600}.primary{background:var(--ink);color:white}fieldset{border:0;padding:0;margin:0}a{text-decoration:underline}@media(max-width:700px){body{padding:16px}main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}#list{max-height:220px;overflow:auto}}</style>
<header><div><h1>空空山谷 · 作品管理</h1><p class="hint">编辑 → 保存到本机 → 预览 → 发布正式网站</p></div><a href="/" target="_blank">打开网站预览 ↗</a></header>
<p id="status" role="status" aria-live="polite"></p><main><aside><button id="add">＋ 新增作品</button><div id="list"></div></aside><section><form id="editor"><fieldset id="fields"><h2 id="editor-title">编辑作品</h2><label>作品英文名<input id="title" required maxlength="160"></label><label>类别<input id="category" required list="categories"></label><datalist id="categories"><option>Cat cups</option><option>Plates</option><option>Tableware</option><option>Mugs</option><option>Jewellery</option></datalist><label>简短介绍<input id="subtitle" maxlength="240"></label><label>详细介绍<textarea id="description" maxlength="5000"></textarea></label><label>图片描述（供读屏使用）<input id="alt" maxlength="500"></label><label>封面照片<input type="file" id="cover" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview" alt="作品封面预览"><label>逐帧照片（按选择顺序；上传后可调整）<input type="file" id="frames" multiple accept="image/jpeg,image/png,image/webp"></label><div id="frames-list" class="frames"></div><p class="hint">建议使用同一作品的连续角度照片；没有连续照片时只展示静态大图。单张最大 10MB。</p><label><input type="checkbox" id="visible"> 在网站展示此作品</label><div class="row"><button type="button" id="up">排序提前</button><button type="button" id="down">排序延后</button><button class="primary" type="submit">保存全部作品到本机</button></div></fieldset></form><p class="hint">保存会写入本机网站文件，并保留历史备份。正式网址不会自动更新；完成本次上新后，请让 Codex 发布更新。无需填写未经确认的价格或制作工艺。</p></section></main>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id);let products=[],selected=0,dirty=false,busy=false;const keys=['title','category','subtitle','description','alt'];
function status(s){$('status').textContent=s}function current(){return products[selected]}function capture(){if(!current())return;keys.forEach(k=>current()[k]=$(k).value);current().visible=$('visible').checked}
function list(){const root=$('list');root.replaceChildren();products.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-pressed',i===selected);const img=document.createElement('img');img.src=p.image||'';img.alt='';if(!p.image)img.hidden=true;const text=document.createElement('span');text.textContent=(p.title||'未命名作品')+(p.visible?'':' · 隐藏');b.append(img,text);b.onclick=()=>{capture();selected=i;render()};root.append(b)})}
function render(){list();keys.forEach(k=>$(k).value=current()[k]||'');$('visible').checked=current().visible;$('preview').src=current().image||'';$('preview').hidden=!current().image;$('cover').value='';$('frames').value='';const root=$('frames-list');root.replaceChildren();current().frames.forEach((src,i)=>{const f=document.createElement('figure'),im=document.createElement('img');im.src=src;im.alt='第 '+(i+1)+' 帧';f.append(im);for(const [label,action] of [['←',()=>{if(i){const a=current().frames;[a[i-1],a[i]]=[a[i],a[i-1]]}}],['移除',()=>current().frames.splice(i,1)]]){const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',label+'第 '+(i+1)+' 帧');b.onclick=()=>{capture();action();dirty=true;render()};f.append(b)}root.append(f)})}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');return d}
async function upload(file){if(file.size>10000000)throw Error('图片请小于 10MB');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});return (await api('/api/upload',{data})).path}
for(const id of ['cover','frames'])$(id).onchange=async()=>{capture();const files=[...$(id).files];if(!files.length)return;busy=true;$('fields').disabled=true;status('正在保存照片…');try{if(id==='frames'&&current().frames.length+files.length>40)throw Error('动画最多 40 帧');for(const f of files){const path=await upload(f);if(id==='cover')current().image=path;else current().frames.push(path)}dirty=true;status('照片已上传，请保存全部作品。')}catch(e){status(e.message)}finally{busy=false;$('fields').disabled=false;render()}};
$('add').onclick=()=>{if(busy)return;capture();products.push({id:crypto.randomUUID(),title:'',category:'Cat cups',subtitle:'',description:'',alt:'',image:'',frames:[],visible:false});selected=products.length-1;dirty=true;render();$('title').focus()};
for(const [id,delta] of [['up',-1],['down',1]])$(id).onclick=()=>{capture();const target=selected+delta;if(target<0||target>=products.length)return;[products[selected],products[target]]=[products[target],products[selected]];selected=target;dirty=true;render()};
$('editor').oninput=()=>dirty=true;$('editor').onsubmit=async e=>{e.preventDefault();capture();$('fields').disabled=true;try{await api('/api/products',products);dirty=false;list();status('已保存到本机。可打开预览；正式网站待发布。')}catch(e){status(e.message)}finally{$('fields').disabled=false}};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
fetch('/products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('无法读取作品');return r.json()}).then(p=>{products=p;render()}).catch(e=>{status(e.message);$('fields').disabled=true});
</script></html>
